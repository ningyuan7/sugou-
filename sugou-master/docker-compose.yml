version: "3.9"

services:
  # ==================== Redis（会话存储） ====================
  redis:
    image: redis:7-alpine
    container_name: sugou-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== Java 后端（sugou-portal） ====================
  sugou-portal:
    build:
      context: ./sugou-master
      dockerfile: sugou-portal/Dockerfile
    container_name: sugou-portal
    ports:
      - "8086:8086"
    environment:
      - spring.profiles.active=prod
      - spring.datasource.url=jdbc:mysql://host.docker.internal:3306/mall?useSSL=false&serverTimezone=Asia/Shanghai
      - spring.datasource.username=root
      - spring.datasource.password=${MYSQL_PASSWORD:-root}
      - spring.redis.host=redis
      - spring.redis.port=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==================== Python AI 导购服务 ====================
  ai-shopping-guide:
    build:
      context: ./ai-shopping-guide
      dockerfile: Dockerfile
    container_name: ai-shopping-guide
    ports:
      - "8000:8000"
    environment:
      - JAVA_BASE_URL=http://sugou-portal:8086
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen-max}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 水平扩缩就靠这个：docker compose up --scale ai-shopping-guide=3 -d
    deploy:
      replicas: 1

volumes:
  redis-data:


